# =============================================================================
# main 分支镜像的手动兜底构建
# =============================================================================
# 分工（改动见 auto-release.yml）：
#   - 常规路径：合并到 main -> CI 全绿 -> auto-release.yml 自动打 vX.Y.Z tag
#     -> release.yml 用 GoReleaser 构建一次镜像，并在 retag-main-image 里把
#     同一份 manifest 重打成 :main / :main-<short-sha>。
#     一次合并只构建一次镜像，:main 由发版流程负责刷新。
#   - 本 workflow：只保留手动触发，作为兜底。典型场景：
#       * 某次合并带了 [skip release]，不发版但仍想更新 :main
#       * 发版失败、镜像没推成功，需要先把 :main 顶上去
#
# ⚠️ 不要给本 workflow 加回 push / workflow_run 自动触发 ⚠️
# 那会让同一个提交被 release.yml 和这里各构建一次镜像，纯浪费额度，
# 而且两条流水线抢着推 :main，先后顺序不可控。
# =============================================================================
name: Main Docker Image

on:
  # 只保留手动触发。注意：手动触发不看 CI 结论，请自行确认目标提交的 CI 是绿的。
  workflow_dispatch:

# 同一分支的新构建取消掉还在跑的旧构建：省额度，也避免旧 commit 的镜像
# 在后面覆盖掉新 commit 的 main 标签。
concurrency:
  group: main-docker-image-${{ github.ref_name }}
  cancel-in-progress: true

# 默认最小权限，需要写包的权限只在 build job 里单独放开。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 预检：确认触发分支合法 + 计算镜像标签/版本等元数据
  # ---------------------------------------------------------------------------
  check:
    name: 预检与元数据
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      # 手动触发时 GitHub 允许选任意分支，但本 workflow 打的是 main 标签，
      # 从别的分支跑会污染 main 镜像，直接拦掉。
      - name: 校验手动触发的分支
        if: github.ref_name != 'main'
        run: |
          echo "::error::本 workflow 只用于构建 main 分支镜像，当前分支：${{ github.ref_name }}"
          exit 1

      - name: 计算镜像元数据
        id: meta
        env:
          DISPATCH_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          SHA="${DISPATCH_SHA}"
          SHORT_SHA="${SHA:0:7}"

          # 开发版版本号，刻意带 main- 前缀，不伪装成正式版本号（v1.2.3）
          VERSION="main-${SHORT_SHA}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # GHCR 的 owner 必须小写（与 .goreleaser.yaml 里的 GITHUB_REPO_OWNER_LOWER 一致）
          OWNER_LOWER="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${OWNER_LOWER}/sub2api"

          # ---------------------------------------------------------------
          # 标签策略：
          #   :main             浮动标签，站长的自动部署盯这个
          #   :main-<short-sha> 不可变标签，用于回滚到具体提交
          #
          # ⚠️ 绝对不要在这里打 :latest ⚠️
          # latest 属于正式发版：.goreleaser.yaml 的 docker_manifests 里
          # ghcr.io/<owner>/sub2api:latest 由 release.yml 产出。
          # 如果手动构建也去覆盖 latest，所有盯 latest 做部署的环境会
          # 静默吃到未经发版的开发版本 —— 后来者请不要"顺手加上"。
          # ---------------------------------------------------------------
          TAGS="${GHCR_IMAGE}:main"
          TAGS="${TAGS}"$'\n'"${GHCR_IMAGE}:${VERSION}"

          # Docker Hub 可选：只有配置了 DOCKERHUB_USERNAME 才加对应标签
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_USERNAME}/sub2api:main"
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_USERNAME}/sub2api:${VERSION}"
          fi

          {
            echo "sha=${SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "version=${VERSION}"
            echo "build_date=${BUILD_DATE}"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "将构建 ${SHA} -> ${VERSION}"
          echo "${TAGS}"

  # ---------------------------------------------------------------------------
  # 构建并推送多架构镜像
  # ---------------------------------------------------------------------------
  build:
    name: 构建并推送镜像
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # 推 GHCR 用内置的 GITHUB_TOKEN，站长不需要额外配 secret
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      # Dockerfile 的 frontend-builder / backend-builder 都是 FROM --platform=$BUILDPLATFORM
      # 的交叉编译，不走模拟；但最终运行阶段（alpine 里的 apk add / adduser 等 RUN）
      # 是目标架构，构建 linux/arm64 时这几条仍需要 QEMU，所以这一步不能省。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 可选：仅当配置了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 时才登录并推送
      # （条件写法与 release.yml 保持一致）
      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 关掉 provenance attestation，否则 GHCR 的镜像列表里会多出
          # unknown/unknown 架构条目，和 release.yml 产出的 manifest 形态不一致
          provenance: false
          tags: ${{ needs.check.outputs.tags }}
          labels: |
            org.opencontainers.image.title=sub2api
            org.opencontainers.image.description=Sub2API - AI API Gateway Platform
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
            org.opencontainers.image.created=${{ needs.check.outputs.build_date }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            COMMIT=${{ needs.check.outputs.sha }}
            DATE=${{ needs.check.outputs.build_date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          # GitHub Actions 缓存加速：跨次构建复用 pnpm install / go mod download 等层
          cache-from: type=gha,scope=main-docker-image
          cache-to: type=gha,mode=max,scope=main-docker-image

      - name: 输出镜像信息
        env:
          TAGS: ${{ needs.check.outputs.tags }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            echo "### 已推送镜像（手动兜底构建）"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "- commit: \`${SHA}\`"
            echo "- 持续部署请盯浮动标签 \`:main\`"
            echo "- 需要回滚到本次构建用 \`:${VERSION}\`"
            echo "- \`latest\` 由正式发版（release.yml）产出，本流程不会动它"
            echo "- 常规路径下 \`:main\` 由 release.yml 的 retag-main-image 刷新，无需手动跑本流程"
          } >> "${GITHUB_STEP_SUMMARY}"
